apiVersion: v1
kind: Namespace
metadata:
  name: falco-demo
  labels:
    team: workshop-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: falco-test-runner
  namespace: falco-demo
  labels:
    app: falco-test-runner
spec:
  containers:
  - name: runner
    image: alpine:3.19
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    livenessProbe:
      exec:
        command: ["true"]
      periodSeconds: 30
    readinessProbe:
      exec:
        command: ["true"]
      periodSeconds: 30
