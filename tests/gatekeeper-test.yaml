# OPA Gatekeeper Policy Tests
#
# Apply: kubectl apply -f tests/gatekeeper-test.yaml
# Each Pod is a separate YAML document (---).
# DENIED pods will be rejected at admission with a clear violation message.
# ALLOWED pods will be created successfully — delete them after: kubectl delete -f tests/gatekeeper-test.yaml
#
# Prerequisite: ensure the 'test' namespace exists:
#   kubectl create namespace test

# ── 1. Privileged container — DENIED by BlockPrivilegedContainers ────────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-privileged
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine:3.19
#     securityContext:
#       privileged: true
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}

# ── 2. Privileged init container — DENIED by BlockPrivilegedContainers ───────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-privileged-init
#   namespace: test
# spec:
#   initContainers:
#   - name: setup
#     image: alpine:3.19
#     securityContext:
#       privileged: true
#     resources:
#       requests: {cpu: 50m, memory: 32Mi}
#       limits: {cpu: 100m, memory: 64Mi}
#   containers:
#   - name: app
#     image: alpine:3.19
#     command: ["sleep", "3600"]
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}

# ── 3. Missing resource limits — DENIED by RequireResourceLimits ─────────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-no-limits
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine:3.19

