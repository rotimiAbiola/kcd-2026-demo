# metadata:
#   name: test-latest-tag
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine:latest
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}

# ── 9. Untagged image (implicit :latest) — DENIED by BlockLatestTag ──────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-no-tag
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}

# ── 10. Multiple violations — DENIED by several policies at once ──────────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-multiple-violations
#   namespace: test
# spec:
#   hostNetwork: true
#   hostPID: true
#   containers:
#   - name: app
#     image: badregistry.io/backdoor:latest
#     securityContext:
#       privileged: true
    # no resource limits — violates RequireResourceLimits too

# ── 11. Missing liveness probe — DENIED by RequireProbes ─────────────────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-no-liveness
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine:3.19
#     command: ["sleep", "3600"]
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}
#     readinessProbe:
#       exec:
#         command: ["sh", "-c", "exit 0"]
#       initialDelaySeconds: 5
#       periodSeconds: 10
    # no livenessProbe

# ── 12. Missing readiness probe — DENIED by RequireProbes ────────────────────
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-no-readiness
#   namespace: test
# spec:
#   containers:
#   - name: app
#     image: alpine:3.19
#     command: ["sleep", "3600"]
#     resources:
#       requests: {cpu: 100m, memory: 64Mi}
#       limits: {cpu: 200m, memory: 128Mi}
#     livenessProbe:
#       exec:
#         command: ["sh", "-c", "exit 0"]
#       initialDelaySeconds: 10
#       periodSeconds: 15
    # no readinessProbe

# ── 13. Fully compliant pod — should be ALLOWED ───────────────────────────────
# Satisfies all policies: no privilege escalation, resource limits, approved
# registry, pinned tag, host namespaces false, and both probes defined.
# Expected: kubectl apply succeeds, pod reaches Running state.
# ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: test-compliant
#   namespace: test
#   labels:
#     app: test-compliant
# spec:
#   securityContext:
#     runAsNonRoot: true
#     runAsUser: 1000
#   containers:
#   - name: app
#     image: alpine:3.19
#     command: ["sleep", "3600"]
#     securityContext:
#       privileged: false
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#     resources:
#       requests:
#         cpu: "100m"
#         memory: "64Mi"
#       limits:
#         cpu: "200m"
#         memory: "128Mi"
#     livenessProbe:
#       exec:
#         command: ["sh", "-c", "exit 0"]
#       initialDelaySeconds: 10
#       periodSeconds: 15
#       failureThreshold: 3
#     readinessProbe:
#       exec:
#         command: ["sh", "-c", "exit 0"]
#       initialDelaySeconds: 5
#       periodSeconds: 10
#       failureThreshold: 3

# ── 14. No resources specified — mutated then ALLOWED ─────────────────────────
# Submitted with zero resources. The mutating webhook (gatekeeper-policies/
# mutations/) fills in requests/limits for cpu and memory before the
# RequireResourceLimits validating constraint ever sees the object, so the
# same Pod that would be DENIED in test #3 now passes.
# Verify the injected defaults: kubectl get pod test-mutated-defaults -n test -o yaml
# ---
apiVersion: v1
kind: Pod
metadata:
  name: test-mutated-defaults
  namespace: test
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "3600"]

