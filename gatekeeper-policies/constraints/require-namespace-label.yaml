apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireNamespaceLabel
metadata:
  name: require-namespace-label
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: "gatekeeper.sh/ignore"
          operator: DoesNotExist
  parameters:
    label: "team"
