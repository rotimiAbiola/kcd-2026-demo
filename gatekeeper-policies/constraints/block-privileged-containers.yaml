apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BlockPrivilegedContainers
metadata:
  name: block-privileged-containers
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: "gatekeeper.sh/ignore"
          operator: DoesNotExist