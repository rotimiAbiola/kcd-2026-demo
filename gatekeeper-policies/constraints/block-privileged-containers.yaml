apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BlockPrivilegedContainers
metadata:
  name: block-privileged-containers
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    # Target tenant namespaces only — system namespaces exempt via webhook config
    # Add your namespace naming pattern here
    namespaceSelector:
      matchExpressions:
        - key: pipeops.io/tenant
          operator: Exists