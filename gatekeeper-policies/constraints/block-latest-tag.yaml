apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BlockLatestTag
metadata:
  name: block-latest-tag
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: pipeops.io/tenant
          operator: Exists