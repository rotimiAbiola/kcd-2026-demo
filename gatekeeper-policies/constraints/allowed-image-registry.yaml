apiVersion: constraints.gatekeeper.sh/v1beta1
kind: AllowedImageRegistry
metadata:
  name: allowed-image-registry
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: "afaas"
          operator: Exists
  parameters:
    allowedRegistries:
      - "docker.io"   
      - "ghcr.io"           