apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requireresourcelimits
  annotations:
    description: >
      Requires all containers to have CPU and memory requests and limits defined.
      Pods without resource constraints can starve neighbouring workloads.
spec:
  crd:
    spec:
      names:
        kind: RequireResourceLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requireresourcelimits

        # Check all container types
        containers[container] {
          container := input.review.object.spec.containers[_]
        }
        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.requests.cpu
          msg := sprintf(
            "Container <%v> is missing resources.requests.cpu",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.requests.memory
          msg := sprintf(
            "Container <%v> is missing resources.requests.memory",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.limits.cpu
          msg := sprintf(
            "Container <%v> is missing resources.limits.cpu",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.limits.memory
          msg := sprintf(
            "Container <%v> is missing resources.limits.memory",
            [container.name]
          )
        }