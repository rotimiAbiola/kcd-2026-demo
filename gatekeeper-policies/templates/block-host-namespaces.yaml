apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: blockhostnamespaces
  annotations:
    description: >
      Blocks pods from using hostNetwork, hostPID, or hostIPC in tenant namespaces.
      These settings give containers direct access to host-level resources and
      are not permitted in multi-tenant environments.
spec:
  crd:
    spec:
      names:
        kind: BlockHostNamespaces
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package blockhostnamespaces

        violation[{"msg": msg}] {
          input.review.object.spec.hostNetwork == true
          msg := sprintf(
            "Pod <%v> uses hostNetwork. Not permitted in tenant namespaces.",
            [input.review.object.metadata.name]
          )
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostPID == true
          msg := sprintf(
            "Pod <%v> uses hostPID. Not permitted in tenant namespaces.",
            [input.review.object.metadata.name]
          )
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostIPC == true
          msg := sprintf(
            "Pod <%v> uses hostIPC. Not permitted in tenant namespaces.",
            [input.review.object.metadata.name]
          )
        }