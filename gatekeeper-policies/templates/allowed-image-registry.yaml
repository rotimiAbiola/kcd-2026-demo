apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: allowedimageregistry
  annotations:
    description: >
      Restricts container images to approved registries only.
      Tenant workloads must pull from Harbor. Public registries
      are not permitted in production namespaces.
spec:
  crd:
    spec:
      names:
        kind: AllowedImageRegistry
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedRegistries:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package allowedimageregistry

        # Extract registry prefix from image string
        get_registry(image) = registry {
          parts := split(image, "/")
          # If first part contains a dot or colon, it's a registry hostname
          contains(parts[0], ".")
          registry := parts[0]
        }

        get_registry(image) = registry {
          parts := split(image, "/")
          contains(parts[0], ":")
          registry := parts[0]
        }

        # Default to docker.io if no registry prefix
        get_registry(image) = "docker.io" {
          parts := split(image, "/")
          not contains(parts[0], ".")
          not contains(parts[0], ":")
        }

        all_containers[container] {
          container := input.review.object.spec.containers[_]
        }
        all_containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := all_containers[_]
          registry := get_registry(container.image)
          allowed := input.parameters.allowedRegistries
          not registry_allowed(registry, allowed)
          msg := sprintf(
            "Container <%v> uses image <%v> from registry <%v>. Only %v registries are permitted.",
            [container.name, container.image, registry, allowed]
          )
        }

        registry_allowed(registry, allowed) {
          startswith(registry, allowed[_])
        }